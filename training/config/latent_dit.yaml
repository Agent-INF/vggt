# Latent DiT training configuration for Phase 2
# Trains DiT to generate geometry in compressed latent space

defaults:
  - default_dataset.yaml

exp_name: latent_dit_phase2
img_size: 518
num_workers: 8
seed_value: 42
accum_steps: 2
patch_size: 14
val_epoch_freq: 5
max_img_per_gpu: 16  # Reduced for DiT training

limit_train_batches: 1000
limit_val_batches: 200


# Diffusion configuration
diffusion:
  num_timesteps: 1000
  beta_schedule: "cosine"
  model_mean_type: "epsilon"  # Predict noise
  model_var_type: "fixed_small"
  loss_type: "mse"


# Data configuration - uses pre-extracted latent z
data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
      repeat_batch: False
      # Load pre-computed latent z from Phase 1
      use_precomputed_latent: True
      latent_cache_dir: /YOUR/PATH/TO/LATENT_CACHE
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.co3d.Co3dDataset
          split: train
          CO3D_DIR: /YOUR/PATH/TO/CO3D
          CO3D_ANNOTATION_DIR: /YOUR/PATH/TO/CO3D_ANNOTATION
  val:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
      use_precomputed_latent: True
      latent_cache_dir: /YOUR/PATH/TO/LATENT_CACHE
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.co3d.Co3dDataset
          split: test
          CO3D_DIR: /YOUR/PATH/TO/CO3D
          CO3D_ANNOTATION_DIR: /YOUR/PATH/TO/CO3D_ANNOTATION


logging:
  log_dir: logs
  log_visuals: True  # Visualize generated samples
  log_freq: 1
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss
        - mse
    val:
      keys_to_log:
        - loss
        - mse


checkpoint:
  save_dir: logs/${exp_name}/ckpts
  save_freq: 5
  resume_checkpoint_path: null
  strict: False


# Loss is computed by GaussianDiffusion
loss:
  _target_: vggt.utils.diffusion.GaussianDiffusion
  num_timesteps: ${diffusion.num_timesteps}
  beta_schedule: ${diffusion.beta_schedule}
  model_mean_type: ${diffusion.model_mean_type}
  model_var_type: ${diffusion.model_var_type}
  loss_type: ${diffusion.loss_type}


# Optimizer configuration
optim:
  param_group_modifiers: False

  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4
    weight_decay: 0.05

  frozen_module_names: []  # Train all DiT parameters

  amp:
    enabled: True
    amp_dtype: bfloat16
  
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["dit"]
        max_norm: 1.0
        norm_type: 2
  
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-6
              end_value: 1e-4
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 1e-4
              end_value: 1e-6
          lengths: [0.1, 0.9]
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05


max_epochs: 100


# Model configuration
model:
  # DiT for latent space generation
  dit:
    _target_: vggt.models.latent_dit.LatentDiT
    latent_dim: 512
    hidden_dim: 1024
    depth: 12
    num_heads: 16
    mlp_ratio: 4.0
    num_frames: 16
    num_patches: 256  # (37*37) // 4^2 ≈ after spatial downsampling
    dropout: 0.0
    use_cross_attention: False
    condition_dim: null  # Unconditional or simple conditioning

  # Frozen AutoEncoder for decoding generated samples
  autoencoder:
    _target_: vggt.models.latent_autoencoder.LatentAutoEncoder
    input_dim: 2048
    num_layers: 4
    hidden_dim: 1024
    latent_dim: 512
    num_encoder_blocks: 4
    num_decoder_blocks: 4
    num_heads: 16
    spatial_downsample: 4
    intermediate_layer_idx: [4, 11, 17, 23]
    # Load pretrained weights from Phase 1
    pretrained_path: /YOUR/PATH/TO/AUTOENCODER_CKPT

  # Frozen VGGT for evaluation (decode to depth)
  vggt:
    _target_: vggt.models.vggt.VGGT
    enable_camera: False
    enable_depth: True
    enable_point: False
    enable_track: False


distributed:
  backend: nccl
  comms_dtype: null
  find_unused_parameters: False
  timeout_mins: 30
  gradient_as_bucket_view: True
  bucket_cap_mb: 25
  broadcast_buffers: True


cuda:
  cudnn_deterministic: False
  cudnn_benchmark: False
  allow_tf32: True
